name: CL-06 merge helper

on:
  push:
    branches:
      - tmp/cl06-merge-helper

permissions:
  contents: write

jobs:
  merge-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CL-06 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/cl-06-routing-profile-compatibility
          fetch-depth: 0

      - name: Merge current dev while preserving the feature workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev

          set +e
          git merge --no-ff --no-commit origin/dev
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            printf 'Conflicts:\n%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^\.github/workflows/ci\.yml$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected merge conflicts; refusing to guess"
              exit 1
            fi

            # The workflow-file write will be applied separately through the
            # GitHub connector, whose credential can update workflow files.
            # Keep the feature workflow unchanged in this merge commit so the
            # Actions token can push the otherwise mechanical dev merge.
            git checkout --ours .github/workflows/ci.yml
            git add .github/workflows/ci.yml
          elif [ "$merge_status" -ne 0 ]; then
            echo "::error::git merge failed without reported conflicts"
            exit "$merge_status"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git status --short
          git commit -m "merge dev into CL-06 branch"
          git push origin HEAD:feat/cl-06-routing-profile-compatibility
