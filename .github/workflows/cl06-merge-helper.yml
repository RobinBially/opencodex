name: CL-06 merge helper

on:
  push:
    branches:
      - tmp/cl06-merge-helper

permissions:
  contents: write

jobs:
  materialize-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: tmp/cl06-merge-helper
          fetch-depth: 0

      - name: Materialize current dev CI plus storage API isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git show origin/dev:.github/workflows/ci.yml > cl06-ci-final.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path('cl06-ci-final.yml')
          text = path.read_text()

          storage_policy = "--path-ignore-patterns 'tests/api-storage-policy*.test.ts'"
          storage_api = "--path-ignore-patterns 'tests/api-storage.test.ts'"
          usage_api = "--path-ignore-patterns 'tests/api-usage.test.ts'"
          lines = text.splitlines()
          matches = [
              i for i, line in enumerate(lines)
              if 'run: bun test --isolate tests' in line
              and storage_policy in line
              and usage_api in line
              and '--shard=' in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one current-dev shard command, found {len(matches)}')
          i = matches[0]
          if storage_api not in lines[i]:
              lines[i] = lines[i].replace(usage_api, f'{storage_api} {usage_api}', 1)
          text = '\n'.join(lines) + '\n'

          old_storage = "            ./tests/api-storage-policy-run.test.ts \\\n            ./tests/api-storage-policy.test.ts"
          new_storage = "            ./tests/api-storage-policy-run.test.ts \\\n            ./tests/api-storage-policy.test.ts \\\n            ./tests/api-storage.test.ts"
          if old_storage not in text:
              raise SystemExit('expected current-dev storage job list not found')
          text = text.replace(old_storage, new_storage, 1)

          path.write_text(text)
          PY

          git add cl06-ci-final.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: materialize final CL-06 workflow blob"
          git push origin HEAD:tmp/cl06-merge-helper
